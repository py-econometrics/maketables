[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "maketables"
description = """\
  A Python package for creating publication-ready tables from regression results \
  (statsmodels, pyfixest, linearmodels), descriptive statistics, and balance tables \
  with output to LaTeX, Word, and HTML/Great Tables\
  """
readme = "README.md"
keywords = [
  "econometrics",
  "latex",
  "publication",
  "pyfixest",
  "regression",
  "statistics",
  "statsmodels",
  "tables",
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "great-tables>=0.2",
  "ipython>=7",
  "numpy>=1.20",
  "pandas>=1.3",
  "python-docx>=0.8.11",
  "tabulate>=0.9",
]
[[project.authors]]
name = "Alexander Fischer"
email = "alexander-fischer1801@t-online.de"
[[project.authors]]
name = "Dirk Sliwka"
email = "dirk.sliwka@uni-koeln.de"
[project.optional-dependencies]
dev = [
  "linearmodels>=4",
  "pre-commit>=4.3,<5",
  "pyfixest>=0.13,<0.31",
  "pytest>=7",
  "pytest-cov>=4",
  "quartodoc>=0.7",
  "statsmodels>=0.13",
  "syrupy>=4",
  "ty>=0.0.1a20",
]
docs = [
  "ipykernel>=6,<7",
  "nbconvert>=7",
  "pyfixest>=0.13,<0.31",
  "pylatex>=1.4.2,<2",
  "pyyaml>=6,<7",
  "sphinx>=5",
  "sphinx-rtd-theme>=1",
  "statsmodels>=0.13",
]
pystata = [
  "pystata>=0.0.1",
  "stata-setup>=0.1",
]
linearmodels = [
  "linearmodels>=4",
  "statsmodels>=0.13",
]
lifelines = [
  "lifelines>=0.27",
]
[project.urls]
Homepage = "https://py-econometrics.github.io/maketables/"
Documentation = "https://py-econometrics.github.io/maketables/"
Repository = "https://github.com/py-econometrics/maketables"
Issues = "https://github.com/py-econometrics/maketables/issues"

[tool.hatch.build.hooks.vcs]
version-file = "src/maketables/_version.py"
[tool.hatch.build.targets.sdist]
exclude = [ "tests" ]
only-packages = true
[tool.hatch.build.targets.wheel]
only-include = [ "src" ]
sources = [ "src" ]
[tool.hatch.version]
source = "vcs"

[tool.pixi.dependencies]
python = ">=3.10,<3.15"
quarto = ">=1.8.27,<2"
ipywidgets = ">=8.1.8,<9"
[tool.pixi.environments]
default = { features = [ "dev", "py313" ], solve-group = "py313" }
dev = { features = [ "dev", "py313" ], solve-group = "py313" }
docs = { features = [ "docs", "py313" ], solve-group = "py313" }
pystata = { features = [ "pystata", "docs", "py313" ], solve-group = "py313" }
linearmodels = { features = [ "linearmodels", "docs", "py313" ], solve-group = "py313" }
lifelines = { features = [ "lifelines", "docs", "py313" ], solve-group = "py313" }
publish = { features = [ "publish", "py313" ], solve-group = "py313" }
py310 = { features = [ "dev", "py310" ], solve-group = "py310" }
py311 = { features = [ "dev", "py311" ], solve-group = "py311" }
py312 = { features = [ "dev", "py312" ], solve-group = "py312" }
py313 = { features = [ "dev", "py313" ], solve-group = "py313" }
py314 = { features = [ "dev", "py314" ], solve-group = "py314" }
[tool.pixi.feature.dev.dependencies]
quarto = ">=1.8.25,<2"
[tool.pixi.feature.dev.pypi-dependencies]
maketables = { path = ".", editable = true, extras = [ "dev" ] }
[tool.pixi.feature.dev.tasks]
check = "pre-commit run --all-files"
tests = "pytest tests/ -v"
tests-with-cov = "pytest tests/ -v --cov=src/maketables --cov-report=xml"
tests-update-snapshots = "pytest tests/ --snapshot-update -v"
ty = "ty check"
[tool.pixi.feature.docs.tasks]
run-all-notebooks = """\
  jupyter nbconvert --execute --to notebook --inplace DTable.ipynb ETable.ipynb \
  DocxTables.ipynb LatexTables.ipynb WritingPapers.ipynb getting-started.ipynb\
  """
docs-preview = "quarto preview"
docs-install-tex = "quarto install tinytex"
[tool.pixi.feature.publish.pypi-dependencies]
build = ">=1.0"
twine = ">=5.0"
[tool.pixi.feature.publish.tasks]
# Step 1: Clean old builds
clean = { cmd = "python -c \"import shutil; import pathlib; [shutil.rmtree(p, ignore_errors=True) for p in [pathlib.Path('dist'), pathlib.Path('build')] + list(pathlib.Path('.').glob('*.egg-info'))]\"" }
# Step 2: Build the package (depends on clean, so clean runs first)
build = { cmd = "python -m build", depends-on = [ "clean" ] }
# Step 3: Check the built package for errors
check = { cmd = "twine check dist/*", depends-on = [ "build" ] }
# Step 4a: Upload to TestPyPI (for testing)
upload-test = { cmd = "twine upload --repository testpypi dist/*", depends-on = [
  "check"
] }
# Step 4b: Upload to PyPI (production)
upload = { cmd = "twine upload dist/*", depends-on = [ "check" ] }
[tool.pixi.feature.py310.dependencies]
python = "~=3.10.0"
[tool.pixi.feature.py311.dependencies]
python = "~=3.11.0"
[tool.pixi.feature.py312.dependencies]
python = "~=3.12.0"
[tool.pixi.feature.py313.dependencies]
python = "~=3.13.0"
[tool.pixi.feature.py314.dependencies]
python = "~=3.14.0"
[tool.pixi.pypi-dependencies]
maketables = { path = ".", editable = true }
[tool.pixi.workspace]
channels = [ "conda-forge" ]
platforms = [ "linux-64", "osx-64", "osx-arm64", "win-64" ]

[tool.ruff]
target-version = "py310"
line-length = 88
fix = true
unsafe-fixes = false
[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88
[tool.ruff.lint]
# docs: https://docs.astral.sh/ruff/rules/
select = [ "ALL" ]
extend-ignore = [
  # do not enable if formatting
  # docs: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "COM812",  # Conflicts with ruff-format
  "D206",    # Conflicts with ruff-format
  "D300",    # Conflicts with ruff-format
  "E111",    # Conflicts with ruff-format
  "E114",    # Conflicts with ruff-format
  "E117",    # Conflicts with ruff-format
  "ISC001",  # Conflicts with ruff-format
  "W191",    # Conflicts with ruff-format
  "W505",    # Doc line too long
  "A002",    # Public APIs currently use names like `type` and `vars`
  "ANN001",  # Missing type annotation for function argument
  "ANN002",  # Missing type annotation for *args
  "ANN003",  # Missing type annotation for **kwargs
  "ANN201",  # Missing return type annotation for public function
  "ANN202",  # Missing return type annotation for private function
  "ANN204",  # Missing return type annotation for special method
  "ANN401",  # Dynamically typed expressions are used for third-party model APIs
  "A001",    # Some local names mirror public API terminology
  "ARG002",  # Interface-compatible methods often leave arguments unused
  "ARG001",  # Widget callback signatures receive unused event arguments
  "B028",    # No explicit `stacklevel` keyword argument found
  "B904",    # Better exception handling
  "BLE001",  # Optional dependency bridges intentionally catch broad exceptions
  "C901",    # Existing table-building methods are complex
  "D100",    # Missing docstring in public module
  "D102",    # Missing docstring in public method
  "D104",    # Missing docstring in public package
  "D105",    # Missing docstring in magic method
  "D205",    # 1 blank line required between summary line and description
  "D301",    # Raw docstring rules conflict with examples containing backslashes
  "E501",    # Line length regulated by formatter
  "EM101",   # Exception must not use a string literal
  "EM102",   # Exception must not use an f-string literal
  "ERA001",  # Commented examples/debug snippets are cleaned up separately
  "FBT001",  # Public APIs expose boolean positional arguments
  "FBT002",  # Public APIs expose boolean default positional arguments
  "FBT003",  # Third-party APIs accept positional boolean arguments
  "FA100",   # Missing `from __future__ import annotations`
  "FA102",   # Missing `from __future__ import annotations`
  "FIX002",  # Line contains TODO
  "N806",    # External XML/Stata naming conventions use mixed-case local names
  "PD010",   # Prefer pivot_table over unstack
  "PD013",   # Prefer melt over stack
  "PD002",   # Existing pandas code uses inplace operations
  "PD101",   # Prefer alternative constant-series checks
  "PERF203", # Optional dependency probes use try/except inside loops
  "PERF401", # Keep some expanded loops for readability
  "PLC0415", # Optional imports are intentionally local in some code paths
  "PLR0911", # Existing helpers have multiple return paths
  "PLR0912", # Existing table-building methods have many branches
  "PLR0913", # Public APIs intentionally accept many keyword options
  "PLR0915", # Existing table-building methods have many statements
  "PLR2004", # Numeric formatting and tests use local numeric literals
  "PT018",   # Existing asserts combine validation predicates
  "PTH110",  # Pathlib migration is outside this config-focused change
  "PTH112",  # Pathlib migration is outside this config-focused change
  "PTH117",  # Pathlib migration is outside this config-focused change
  "PTH118",  # Pathlib migration is outside this config-focused change
  "PTH120",  # Pathlib migration is outside this config-focused change
  "PTH122",  # Pathlib migration is outside this config-focused change
  "PTH123",  # Pathlib migration is outside this config-focused change
  "RET503",  # Existing save/update helpers return display objects conditionally
  "RET504",  # Existing code sometimes names values before returning
  "RUF001",  # Statistical symbols intentionally use Unicode characters
  "RUF002",  # Statistical symbols intentionally use Unicode characters
  "RUF005",  # Existing tuple construction is left unchanged
  "RUF046",  # Existing numeric formatting uses explicit casts
  "RUF059",  # Existing unpacking names are left unchanged
  "S101",    # Tests and runtime validation currently use assert
  "S105",    # Short format tokens are not passwords
  "S110",    # Optional dependency probes intentionally suppress failures
  "S112",    # Optional dependency probes intentionally continue on failures
  "SIM102",  # Existing nested conditionals are left unchanged
  "SIM105",  # Existing suppressible try blocks are left unchanged
  "SIM108",  # Existing conditional assignments are left unchanged
  "SIM110",  # Use `all` instead of `for` loop
  "SLF001",  # Third-party model APIs expose required data on private attributes
  "T201",    # inspect_model and examples intentionally print diagnostics
  "TC001",   # Move application import into a type-checking block
  "TC002",   # Move third-party import into a type-checking block
  "TC003",   # Move standard library import into a type-checking block
  "TRY300",  # Existing try blocks often return directly
  "TRY301",  # Existing fallback code raises inside try blocks
  "TRY003",  # Avoid specifying long messages outside the exception class
]
[tool.ruff.lint.per-file-ignores]
"docs/**/*.ipynb" = [
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN201",
  "ANN202",
  "D103",
  "E402",
  "INP001",
  "NPY002",
  "PTH103",
  "PTH120",
  "PTH123",
  "RUF001",
  "RUF003",
  "SIM118",
  "T201",
  "W291",
  "W293",
]
"src/maketables/symbols.py" = [ "RUF001", "RUF002" ]
"tests/**/*.py" = [
  "ARG001",
  "ARG002",
  "D100",
  "D103",
  "INP001",
  "NPY002",
  "PLC0415",
  "S101",
]
[tool.ruff.lint.pycodestyle]
max-doc-length = 88
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyproject-fmt]
column_width = 88
max_supported_python = "3.14"
table_format = "long"

[tool.ty.rules]
ambiguous-protocol-member = "error"
deprecated = "error"
division-by-zero = "error"
ignore-comment-unknown-rule = "error"
ineffective-final = "error"
invalid-enum-member-annotation = "error"
invalid-ignore-comment = "error"
invalid-legacy-positional-parameter = "error"
redundant-cast = "error"
unused-awaitable = "error"
unused-ignore-comment = "error"
[tool.ty.src]
include = [ "src/maketables" ]

[tool.pytest.ini_options]
pythonpath = [ "tests" ]

[tool.yamlfix]
line_length = 88
none_representation = "null"
sequence_style = "block_style"
