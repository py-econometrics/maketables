---
codecov:
  notify:
    require_ci_to_pass: true
coverage:
  precision: 2
  round: down
  range: 50...100
  status:
    patch:
      default:
        target: 80%
    project:
      default:
        # Compare against the base commit instead of an absolute bar, so legacy
        # low-coverage modules don't fail every PR. Fails only if a PR lowers
        # total coverage by more than the threshold.
        target: auto
        threshold: 1%
# Files that cannot be exercised in CI. Keep this list short and shrink it as
# coverage grows; keep .coveragerc [run] omit in sync.
ignore:
  - src/maketables/_version.py  # generated by hatch-vcs
  - src/maketables/pystata_extractor.py  # requires a Stata installation
