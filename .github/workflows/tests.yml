name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests on ${{ matrix.os }} / ${{ matrix.environment }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        environment: ["py310", "py311", "py312", "py313", "py314"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: v0.68.1
          cache: true
          environments: ${{ matrix.environment }}
          frozen: true

      - name: Run tests
        if: runner.os != 'Linux' || matrix.environment != 'py314'
        run: pixi run -e ${{ matrix.environment }} tests

      - name: Run tests with coverage
        if: runner.os == 'Linux' && matrix.environment == 'py314'
        run: pixi run -e ${{ matrix.environment }} tests-with-cov

      - name: Upload coverage report
        if: runner.os == 'Linux' && matrix.environment == 'py314'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check snapshots are up to date
        run: pixi run -e ${{ matrix.environment }} pytest tests/ --snapshot-warn-unused
